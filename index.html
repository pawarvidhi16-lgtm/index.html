```html
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Rakhi ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffe0ec, #fff3d6);
        text-align: center;
        overflow: hidden;
    }

    .container {
        background: rgba(255,255,255,0.9);
        padding: 35px 25px;
        border-radius: 25px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
        color: #d6336c;
        font-size: 32px;
    }

    .rakhi {
        font-size: 100px;
        margin: 20px;
        animation: rotate 3s infinite linear;
    }

    @keyframes rotate {
        0% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
        100% { transform: rotate(-5deg); }
    }

    button {
        border: none;
        background: #d6336c;
        color: white;
        padding: 15px 25px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #b51f55;
    }

    #message {
        display: none;
        margin-top: 25px;
        font-size: 20px;
        color: #7a2946;
        line-height: 1.6;
    }

    .heart {
        position: absolute;
        font-size: 25px;
        animation: fall 4s linear forwards;
    }

    @keyframes fall {
        from {
            transform: translateY(-100px);
            opacity: 1;
        }
        to {
            transform: translateY(100vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🎀 Digital Rakhi for my Brother 🎀</h1>

    <div class="rakhi">🪷</div>

    <p>Click on button ❤️</p>

    <button onclick="tieRakhi()">
        💝 Tie Rakhi
    </button>

    <div id="message">
        🥰 <b>Happy Raksha Bandhan Brother!</b> 🥰
        <br><br>

        You are not my brother,
        <br>
        you are  best friend and my strength. ❤️
        <br><br>

        <b>Happy Rakhi Brother! ❤️</b>
    </div>

</div>

<script>

function tieRakhi() {

    document.getElementById("message").style.display = "block";

    for(let i = 0; i < 30; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = Math.random() > 0.5 ? "❤️" : "🌸";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }
}

</script>

</body>
</html>
